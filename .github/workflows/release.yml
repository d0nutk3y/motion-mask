name: Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: motion-mask-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: motion-mask-windows
          path: artifacts/windows

      - name: List downloaded files
        run: find artifacts -type f

      - name: Delete existing rolling tag
        run: git push --delete origin main-latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: "motion-mask latest"
          fail_on_unmatched_files: true
          files: |
            artifacts/linux/motion-mask-linux.tar.gz
            artifacts/windows/motion-mask-windows.zip
          generate_release_notes: false
          body: "latest build"
          make_latest: true
