name: release-fresh

on:
  workflow_dispatch:

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Linux artifact
        run: |
          mkdir -p artifacts/linux
          gh run download ${{ github.run_id }} \
            --name motion-mask-linux.tar.gz \
            --dir artifacts/linux \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        run: |
          mkdir -p artifacts/windows
          gh run download ${{ github.run_id }} \
            --name motion-mask-windows.zip \
            --dir artifacts/windows \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files
        run: find artifacts -type f

      - name: Delete existing rolling tag
        run: git push --delete origin main-latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: "motion-mask latest"
          fail_on_unmatched_files: true
          files: |
            artifacts/linux/motion-mask-linux.tar.gz
            artifacts/windows/motion-mask-windows.zip
          generate_release_notes: false
          body: "latest build"
          make_latest: true
