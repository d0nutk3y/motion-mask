name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: 'ID of workflow run with linux artifact'
        required: true
        type: string
      windows_run_id:
        description: 'ID of workflow run with windows artifact'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: motion-mask-linux.tar.gz
          path: artifacts/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_run_id }}
          if-no-files-found: error

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: motion-mask-windows.zip
          path: artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_run_id }}
          if-no-files-found: error

      - name: Delete existing rolling tag
        run: git push --delete origin main-latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: "motion-mask latest"
          fail_on_unmatched_files: true
          files: |
            artifacts/linux/motion-mask-linux.tar.gz
            artifacts/windows/motion-mask-windows.zip
          generate_release_notes: false
          body: "latest build"
          make_latest: true