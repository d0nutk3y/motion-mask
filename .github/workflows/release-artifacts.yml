name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: 'ID of workflow run with linux artifact'
        required: true
        type: string
      windows_run_id:
        description: 'ID of workflow run with windows artifact'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        run: gh run download ${{ inputs.linux_run_id }} --name motion-mask-linux.tar.gz --dir artifacts/linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows artifact
        run: gh run download ${{ inputs.windows_run_id }} --name motion-mask-windows.zip --dir artifacts/windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded files
        run: |
          ls -la artifacts/linux/
          test -f artifacts/linux/motion-mask-linux.tar.gz || (echo "Linux artifact missing" && exit 1)
          ls -la artifacts/windows/
          test -f artifacts/windows/motion-mask-windows.zip || (echo "Windows artifact missing" && exit 1)

      - name: Delete existing rolling tag
        run: git push --delete origin main-latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: "motion-mask latest"
          fail_on_unmatched_files: true
          files: |
            artifacts/linux/motion-mask-linux.tar.gz
            artifacts/windows/motion-mask-windows.zip
          generate_release_notes: false
          body: "latest build"
          make_latest: true