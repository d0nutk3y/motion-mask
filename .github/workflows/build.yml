name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (including build extra)
        run: uv sync --extra build

      - name: Build with Nuitka
        run: bash packaging/nuitka/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-mask-linux
          path: dist/linux/motion-mask-linux.tar.gz
          include-hidden-files: true

      - name: Delete existing rolling tag
        run: git push --delete origin main-latest || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          target_commitish: ${{ github.sha }}
          name: "build #${{ github.run_number }}"
          fail_on_unmatched_files: true
          files: dist/linux/motion-mask-linux.tar.gz
          generate_release_notes: false
          body: ""
          make_latest: true