name: clear-release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Delete existing release and tag
        run: |
          if gh release view main-latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release exists, deleting..."
            gh release delete main-latest --cleanup-tag -y --repo ${{ github.repository }}
          else
            echo "No existing release, skipping deletion."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}